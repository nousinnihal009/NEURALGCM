version: "3.9"

# Development overrides — hot reload, no nginx
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/api
    volumes:
      - ./api:/app/api
      - ./neuralgcm_weather:/app/neuralgcm_weather
      - ./cache:/app/cache
      - ./forecasts:/app/forecasts
    ports:
      - "8000:8000"

  worker:
    command: >
      celery -A api.worker.celery_app worker
      --loglevel=debug
      --concurrency=1
      --max-tasks-per-child=5
    volumes:
      - ./api:/app/api
      - ./neuralgcm_weather:/app/neuralgcm_weather
      - ./cache:/app/cache
      - ./forecasts:/app/forecasts
