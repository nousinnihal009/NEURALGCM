# Development override — run with:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production:
#   - API and worker use bind-mounts (live code reload)
#   - Uvicorn runs with --reload
#   - No Nginx (dev hits FastAPI directly on :8000)
#   - DEBUG=true, ENVIRONMENT=development

version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: dev
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir api
      --reload-dir neuralgcm_weather
      --log-level debug
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      # Bind-mount source so --reload picks up edits without rebuild
      - .:/app
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: dev
    command: >
      celery -A api.worker.celery_app worker
      --loglevel=debug
      --concurrency=1
      --max-tasks-per-child=10
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - .:/app

  # Nginx is intentionally absent in dev — access FastAPI directly.
  nginx:
    profiles:
      - donotstart
