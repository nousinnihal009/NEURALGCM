name: CI — Test & Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB:       neuralgcm_weather_test
          POSTGRES_USER:     neuralgcm
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports: ["6379:6379"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx

    - name: Run physical unit tests (Phase 1)
      run: pytest neuralgcm_weather/tests/ -v --tb=short
      env:
        JAX_PLATFORMS: cpu
        XLA_PYTHON_CLIENT_PREALLOCATE: "false"

    - name: Run API tests (Phase 2)
      run: pytest api/tests/ -v --tb=short --cov=api --cov-report=xml
      env:
        ENVIRONMENT: testing
        POSTGRES_HOST: localhost
        POSTGRES_DB: neuralgcm_weather_test
        POSTGRES_USER: neuralgcm
        POSTGRES_PASSWORD: test_password
        REDIS_HOST: localhost
        CELERY_BROKER_URL: redis://localhost:6379/1
        CELERY_RESULT_BACKEND: redis://localhost:6379/2
        JAX_PLATFORMS: cpu

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: cd frontend && npm ci
    - run: cd frontend && npm run build
    - run: cd frontend && npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - run: pip install ruff mypy
    - run: ruff check neuralgcm_weather/ api/
    - run: cd frontend && npm ci && npx eslint src/ --ext .ts,.tsx
