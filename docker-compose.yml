version: "3.9"

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: neuralgcm_postgres
    environment:
      POSTGRES_DB:       neuralgcm_weather
      POSTGRES_USER:     neuralgcm
      POSTGRES_PASSWORD: neuralgcm_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralgcm -d neuralgcm_weather"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: neuralgcm_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI server ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: neuralgcm_api
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=neuralgcm_weather
      - POSTGRES_USER=neuralgcm
      - POSTGRES_PASSWORD=neuralgcm_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JAX_PLATFORMS=cpu
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cache:/app/cache
      - ./forecasts:/app/forecasts
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery worker ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: neuralgcm_worker
    command: >
      celery -A api.worker.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=10
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=neuralgcm_weather
      - POSTGRES_USER=neuralgcm
      - POSTGRES_PASSWORD=neuralgcm_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JAX_PLATFORMS=cpu
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
    depends_on:
      - postgres
      - redis
    volumes:
      - ./cache:/app/cache
      - ./forecasts:/app/forecasts
      - ./logs:/app/logs

  # ── Celery Flower (task monitor) ──────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: neuralgcm_flower
    command: >
      celery flower
      --broker=redis://redis:6379/1
      --port=5555
      --url_prefix=flower
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
