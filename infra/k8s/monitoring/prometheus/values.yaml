# Helm values for kube-prometheus-stack
# Install: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack
#          -n monitoring --create-namespace -f values.yaml

grafana:
  enabled: true
  adminPassword: "neuralgcm-grafana-admin"   # change in production
  service:
    type: LoadBalancer
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: neuralgcm
        folder: NeuralGCM
        type: file
        options:
          path: /var/lib/grafana/dashboards/neuralgcm
  dashboardsConfigMaps:
    neuralgcm: "neuralgcm-grafana-dashboards"

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
    # Scrape NeuralGCM API metrics
    - job_name: neuralgcm-api
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [neuralgcm]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port,
                        __meta_kubernetes_pod_ip]
        action: replace
        regex: (\d+);(.*)
        replacement: $2:$1
        target_label: __address__
    # Scrape Celery worker metrics (flower exporter)
    - job_name: celery-flower
      static_configs:
      - targets: ["neuralgcm-flower:5555"]
      metrics_path: /metrics

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
    receivers:
    - name: default
      email_configs:
      - to: alerts@yourcompany.com
        from: neuralgcm-alerts@yourcompany.com
        smarthost: smtp.gmail.com:587
