apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralgcm-api
  namespace: neuralgcm
  labels:
    app: neuralgcm-api
    version: "latest"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuralgcm-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime deployments
  template:
    metadata:
      labels:
        app: neuralgcm-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: neuralgcm-sa

      # Prefer CPU nodes (not GPU nodes — those are for workers)
      nodeSelector:
        role: api

      containers:
      - name: api
        # IMAGE_URL replaced by deploy.sh script
        image: REGISTRY_URL/api:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http

        envFrom:
        - configMapRef:
            name: neuralgcm-api-config

        # Secrets from K8s secrets (sourced from GCP Secret Manager)
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neuralgcm-secrets
              key: db-password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: neuralgcm-secrets
              key: secret-key
        - name: JAX_PLATFORMS
          value: "cpu"
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: "false"

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

        # Readiness probe: pod only gets traffic when DB+Redis ready
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        # Liveness probe: restart if health check fails
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3

        # Startup probe: give time for DB migration on first boot
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 12
          periodSeconds: 10
