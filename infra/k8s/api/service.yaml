apiVersion: v1
kind: Service
metadata:
  name: neuralgcm-api-service
  namespace: neuralgcm
spec:
  selector:
    app: neuralgcm-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP
---
# External LoadBalancer for public access
apiVersion: v1
kind: Service
metadata:
  name: neuralgcm-api-lb
  namespace: neuralgcm
  annotations:
    cloud.google.com/load-balancer-type: "External"
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: neuralgcm-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer
