apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuralgcm-api-hpa
  namespace: neuralgcm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuralgcm-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # don't scale down too fast
    scaleUp:
      stabilizationWindowSeconds: 30
