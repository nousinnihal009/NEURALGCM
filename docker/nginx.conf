# NeuralGCM Weather API — Nginx reverse proxy
# Terminates HTTP, proxies to FastAPI on port 8000,
# serves static forecast files directly from disk.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      application/json text/plain text/csv;

    # Rate limiting zone (complement to slowapi — nginx-level burst protection)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    upstream neuralgcm_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # ── API proxy ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://neuralgcm_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;
        }

        # ── Health / readiness (no rate limit) ────────────────
        location ~ ^/(health|ready)$ {
            proxy_pass       http://neuralgcm_api;
            proxy_set_header Host $host;
        }

        # ── Static forecast files (PNG, CSV, JSON) ────────────
        location /static/forecasts/ {
            alias /app/forecasts/;
            expires 6h;
            add_header Cache-Control "public, max-age=21600";
            add_header X-Content-Type-Options nosniff;
        }

        # ── Flower task monitor ───────────────────────────────
        location /flower/ {
            auth_basic           "NeuralGCM Task Monitor";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass           http://flower:5555/flower/;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Strip Authorization header before forwarding to Flower
            # (Flower has no auth — nginx handles it entirely)
            proxy_set_header     Authorization     "";
        }

        # ── Block non-API paths ───────────────────────────────
        location / {
            proxy_pass http://neuralgcm_api;
        }
    }
}
